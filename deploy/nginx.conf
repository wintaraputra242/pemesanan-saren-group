# Reference Nginx server block for pemesanan-saren-group (Laravel).
#
# The server already runs CloudPanel, which manages Nginx + PHP-FPM through
# its own "Vhost" editor per site (Sites -> your domain -> Vhost tab) instead
# of /etc/nginx/sites-available. Don't drop this file in as a standalone
# site — CloudPanel would not know about it and may overwrite it.
#
# Use it as a reference for what the CloudPanel-generated vhost needs to
# contain: point `root` at the Laravel `public/` folder (CloudPanel defaults
# to the site's htdocs root), keep the PHP-FPM location block matching the
# site's PHP version socket, and add the two `location` blocks below (dotfile
# protection + client_max_body_size) inside the generated server {} block.

server {
    listen 80;
    listen [::]:80;
    server_name GANTI_DENGAN_DOMAIN_ANDA www.GANTI_DENGAN_DOMAIN_ANDA;
    root /home/GANTI_DENGAN_SITE_USER/htdocs/GANTI_DENGAN_DOMAIN_ANDA/public;

    add_header X-Frame-Options "SAMEORIGIN";
    add_header X-Content-Type-Options "nosniff";

    index index.php;

    charset utf-8;

    # Allow large artwork uploads (matches max:51200 KB validation in the app)
    client_max_body_size 60m;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    error_page 404 /index.php;

    location ~ \.php$ {
        fastcgi_pass unix:/run/php/php8.3-fpm.sock;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
        fastcgi_read_timeout 300;
    }

    # Block access to dotfiles (.env, .git, etc.) and storage internals
    location ~ /\. {
        deny all;
    }

    location ~* /storage/.*\.php$ {
        deny all;
    }

    access_log /var/log/nginx/sarengroup-access.log;
    error_log  /var/log/nginx/sarengroup-error.log;
}
