; Supervisor config for the Laravel queue worker.
; Copy to /etc/supervisor/conf.d/sarengroup-worker.conf on the server (run as
; root/admin, not the CloudPanel site user).
;
; CloudPanel doesn't manage long-running background processes, so Supervisor
; is installed separately (apt install supervisor). Replace GANTI_DENGAN_*
; below with the site's actual CloudPanel site user and domain, and set
; `user=` to that same site user — NOT www-data, since CloudPanel's PHP-FPM
; pool for this site runs as the site user, and the queue worker needs the
; same filesystem permissions.

[program:sarengroup-worker]
process_name=%(program_name)s_%(process_num)02d
command=php /home/pemesanan-saren-group/htdocs/pemesanan-saren-group.my.id/pemesanan-saren-group/artisan queue:work database --sleep=3 --tries=3 --max-time=3600
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
user=pemesanan-saren-group
numprocs=1
redirect_stderr=true
stdout_logfile=/home/pemesanan-saren-group/htdocs/pemesanan-saren-group.my.id/pemesanan-saren-group/storage/logs/worker.log
stopwaitsecs=3600
